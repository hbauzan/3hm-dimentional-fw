# =============================================================================
# TRANSPARENT DEV PROTOCOL — pre-commit base template (Stack-Agnostic)
# -----------------------------------------------------------------------------
# Usage in a new app:
#   1. Copy this file to the workspace ROOT as `.pre-commit-config.yaml`.
#   2. Install the git hook once:   pre-commit install
#   3. Smoke-test the whole repo:   pre-commit run --all-files
#
# Pin the `rev:` tags to current releases when you adopt this in a repo.
# Adapt linters and formatters below to match the project's canonical toolchain.
# =============================================================================

repos:
  # --- General hygiene & safety (Stack-Agnostic) ------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key        # blocks committed private keys

  # --- Secret scanning (enforces "no keys in git" — SKILL.md §3.2) -----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Local guard: never let an actual .env file get staged -----------------
  - repo: local
    hooks:
      - id: block-dotenv
        name: block committing .env files
        entry: "Refusing to commit a .env file. Keep secrets out of git; commit .env.example instead."
        language: fail
        files: '(^|/)\.env(\..+)?$'
        # Allow the documented example file through:
        exclude: '(^|/)\.env\.example$'

