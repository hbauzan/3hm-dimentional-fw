# Darwin arm64: setup.sh runs tools/bge_m3_mps_server.py and does not start this container.
# Other hosts keep this Compose service as the BGE-M3 embedder on :8080.
services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: sf-tei
    platform: linux/amd64
    ports:
      - "8080:80"
    volumes:
      - ~/.cache/huggingface/hub:/data
    command: --model-id BAAI/bge-m3 --port 80 --max-client-batch-size 16 --max-concurrent-requests 64
    restart: unless-stopped
