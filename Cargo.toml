[workspace]
resolver = "2"
members = [
    "crates/sf-kernels",
    "crates/sf-storage",
    "crates/sf-proxy",
    "crates/sf-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Héctor Andrés Bauzán Saavedra"]
publish = false

[workspace.dependencies]
# Storage & columnar engine. sf-storage imports Arrow exclusively via
# lancedb::arrow::{arrow_array, arrow_buffer, arrow_schema}. The exact pins
# force the resolver onto 58.0.0 (caret "58.0.0" would float inside ^58).
lancedb = { version = "0.40.0", default-features = false }
arrow-array = "=58.0.0"
arrow-buffer = "=58.0.0"
arrow-schema = "=58.0.0"

# Async runtime & HTTP/gRPC proxy
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-stream = "0.1.17"
axum = { version = "0.8.1", features = ["http1", "http2", "json"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
tonic = { version = "0.12.3", features = ["transport", "prost"] }
tonic-build = "0.12.3"
prost = "0.13.4"
prost-build = "0.13.4"
bytes = "1.10.0"
futures-util = "0.3.31"
async-trait = "0.1.86"
tower = { version = "0.5.2", features = ["util"] }

# Concurrency, crypto & serialization
arc-swap = "1.7.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
clap = { version = "4.5.23", features = ["derive"] }
half = "2.4.1"

# Benchmarking & deterministic RNG
criterion = { version = "0.5.1", features = ["html_reports"] }
hdrhistogram = "7.5.4"
rand = "0.8.5"
rand_chacha = "0.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 1
